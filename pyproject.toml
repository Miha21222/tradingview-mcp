[project]
name = "tvmcp"
version = "0.1.0"
description = "TradingView MCP server: market data, SMC/ICT scanning, chart rendering, backtesting for AI agents. Not affiliated with TradingView, Inc."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=3.4,<4",
    "tradingview-screener>=3.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "httpx>=0.27",
    "pydantic>=2.7",
    "smartmoneyconcepts==0.0.27",
    "playwright>=1.45",
    "backtesting==0.6.6",
    "tvdatafeed-enhanced>=2.2.1",
    "websocket-client>=1.9.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
tvmcp = "tvmcp.server:main"
tv = "tvmcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tvmcp"]

[tool.pytest.ini_options]
addopts = "-m 'not network and not browser'"
markers = [
    "network: tests that hit live external services (excluded by default)",
    "browser: tests that launch headless Chromium (excluded by default; needs `playwright install chromium`)",
]
testpaths = ["tests"]
